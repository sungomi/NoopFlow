name: build

# Builds only when a version tag is pushed (e.g. `git tag v0.1.1 && git push origin v0.1.1`)
# or when started by hand from the Actions tab. Ordinary pushes don't build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targets: ""
            args: ""
          - os: macos-latest
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@v2
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Test core
        run: cargo test -p noopflow-core
      # A fixed self-signed certificate gives every build the same code identity,
      # so macOS keeps the Accessibility permission across updates (ad-hoc
      # signatures change with every build). Falls back to ad-hoc without secrets.
      - name: Import signing certificate (macOS)
        id: macsign
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then
            echo "No signing secrets; using ad-hoc signature."
            echo "config={}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KC="$RUNNER_TEMP/noopflow.keychain-db"
          KP="$(uuidgen)"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Trust it for code signing on this runner so codesign accepts the identity.
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:MAC_CERT_PASSWORD -nokeys -legacy -out "$RUNNER_TEMP/cert.pem" 2>/dev/null \
            || openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:MAC_CERT_PASSWORD -nokeys -out "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          security find-identity -p codesigning "$KC"
          echo 'config={"bundle":{"macOS":{"signingIdentity":"NoopFlow Developer"}}}' >> "$GITHUB_OUTPUT"
      - name: Build app
        working-directory: src-tauri
        shell: bash
        run: |
          if [ -n '${{ steps.macsign.outputs.config }}' ] && [ '${{ steps.macsign.outputs.config }}' != '{}' ]; then
            cargo tauri build ${{ matrix.args }} --config '${{ steps.macsign.outputs.config }}'
          else
            cargo tauri build ${{ matrix.args }}
          fi
      - name: Verify macOS code signature
        if: runner.os == 'macOS'
        run: |
          APP=target/universal-apple-darwin/release/bundle/macos/NoopFlow.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Signature|Authority|Identifier|Format"
          echo "Designated requirement (what macOS remembers for permissions):"
          codesign -d -r- "$APP" 2>&1 | tail -n 1
      - uses: actions/upload-artifact@v4
        with:
          name: noopflow-${{ matrix.os }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe

  release:
    # Tag builds publish the installers on the Releases page.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*.exe
