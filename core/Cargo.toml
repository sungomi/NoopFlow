[package]
name = "noopflow-core"
version = "0.1.0"
edition = "2021"
description = "NoopFlow core: input sharing engine, secure transport, discovery, clipboard and file transfer"
authors = ["sungomi"]
license = "MIT"

[dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }
snow = "0.9"
rand = "0.8"
sha2 = "0.10"
arboard = "3"
png = "0.17"
dirs = "5"
if-addrs = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_UI_HiDpi",
  "Win32_System_Threading",
] }

[dev-dependencies]
env_logger = "0.11"
