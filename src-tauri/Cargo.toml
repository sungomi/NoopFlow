[package]
name = "noopflow"
version = "0.1.0"
edition = "2021"
description = "NoopFlow - one keyboard and mouse for your Windows and Mac"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
noopflow-core = { path = "../core" }
